name: Update AI Finance News

on:
  schedule:
    - cron: '0 7,19 * * *'   # twice daily: 07:00 and 19:00 UTC
  workflow_dispatch:        # allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest news
        run: python scripts/fetch_news.py

      - name: Commit updated articles
        run: |
          git config user.name  "AI Finance Bot"
          git config user.email "bot@ai-finance-monitor.github"
          git add data/articles.json
          if git diff --cached --quiet; then
            echo "No new articles — nothing to commit"
          else
            git commit -m "chore: auto-update AI finance news [skip ci]"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        continue-on-error: true  # graceful if Pages isn't configured yet
