name: Update AI Finance News

on:
  schedule:
    - cron: '0 7,19 * * *'   # twice daily: 07:00 and 19:00 UTC
  workflow_dispatch:          # allow manual trigger from Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.commit.outputs.updated }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest news
        run: python scripts/fetch_news.py

      - name: Commit updated articles
        id: commit
        run: |
          git config user.name  "AI Finance Bot"
          git config user.email "bot@ai-finance-monitor.github"
          git add data/articles.json
          if git diff --cached --quiet; then
            echo "No new articles — skipping deploy"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-update AI finance news"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: fetch
    if: needs.fetch.outputs.updated == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main   # pick up the commit just pushed by fetch job

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
